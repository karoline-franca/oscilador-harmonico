simulation:
  n_sistemas: 1
  n_condicoes_iniciais: 100
  num_periodos: 1
  dt: 0.01
  save_every: 2

intervals:
  parametro_mu: 0.05                  # parâmetro de não linearidade
  x0_min: -3.0                        # posição inicial mínima
  x0_max: 3.0                         # posição inicial máxima
  y0_min: -3.0                        # velocidade inicial mínima
  y0_max: 3.0                         # velocidade inicial máxima

seed: 42

visualization:
  width_3d: 1200
  height_3d: 900
  width_2d: 1400
  height_2d: 1000
  legend_font_size: 12
  hover_font_size: 12

outputs:
  base_csv: "base_vdp.csv"

mlp:
  hidden_dims: [64, 128, 256]       # camadas ocultas
  activation: "relu"                # função de ativação
  batch_size: 512                   # tamanho do batch
  epochs: 1000                      # número de épocas
  learning_rate: 0.005              # taxa de aprendizado
  weight_decay: 0.00005             # regularização L2