simulation:
  n_sistemas: 5
  n_condicoes_por_sistema: 500
  num_periodos: 1
  dt: 0.01

intervals:
  omega_min: 1.0        # rad/s (f≈0.16 Hz)
  omega_max: 5.0        # rad/s (f≈0.80 Hz)
  x0_min: -0.5          # metros (deslocamento típico de mola)
  x0_max: 0.5
  v0_min: -1.0          # m/s (3.6 km/h)
  v0_max: 1.0

seed: 42

visualization:
  width_3d: 1200
  height_3d: 900
  width_2d: 1400
  height_2d: 1000
  legend_font_size: 12
  hover_font_size: 12

outputs:
  base_csv: "base_ohs.csv"

mlp:
  hidden_dims: [64, 128, 64]       # camadas ocultas
  batch_size: 512                  # tamanho do batch
  epochs: 500                      # número de épocas
  learning_rate: 0.005             # taxa de aprendizado
  weight_decay: 0.00005            # regularização L2