simulation:
  n_sistemas: 200
  n_condicoes_iniciais: 200
  num_periodos: 1
  dt: 0.1

intervals:
  omega_min: 1.0        
  omega_max: 5.0       
  x0_min: -0.5          
  x0_max: 0.5
  v0_min: -1.0          
  v0_max: 1.0

seed: 42

visualization:
  width_3d: 1200
  height_3d: 900
  width_2d: 1400
  height_2d: 1000
  legend_font_size: 12
  hover_font_size: 12

outputs:
  base_csv: "base_ohs.csv"

mlp:
  hidden_dims: [64, 128, 64]       # camadas ocultas
  activation: "relu"               # função de ativação
  batch_size: 512                  # tamanho do batch
  epochs: 100                      # número de épocas
  learning_rate: 0.005             # taxa de aprendizado
  weight_decay: 0.00005            # regularização L2