simulation:
  n_sistemas: 1
  n_condicoes_iniciais: 10000
  num_periodos: 1
  dt: 0.1
  save_every: 2
  t_final_padrao: 200.0              # tempo final para sistemas que não oscilam

intervals:
  parametro_epsilon: 0.08            # separação de escalas (0 < epsilon << 1)
  v0_min: -3.0                       # potencial inicial mínimo
  v0_max: 3.0                        # potencial inicial máximo
  w0_min: -3.0                       # recuperação inicial mínima
  w0_max: 3.0                        # recuperação inicial máxima

# parâmetros fixos
a: 0.7                               # recuperação (offset da nuliclina de w)
b: 0.8                               # recuperação (inclinação da nuliclina de w)
I: 0.5                               # corrente aplicada (entrada externa)
R: 0.1                               # resistência de acoplamento      

seed: 42

visualization:
  width_3d: 1200
  height_3d: 900
  width_2d: 1400
  height_2d: 1000
  legend_font_size: 12
  hover_font_size: 12

outputs:
  base_csv: "base_fhn.csv"

mlp:
  hidden_dims: [64, 128, 256]       # camadas ocultas
  activation: "relu"                # função de ativação
  batch_size: 512                   # tamanho do batch
  epochs: 1000                      # número de épocas
  learning_rate: 0.005              # taxa de aprendizado
  weight_decay: 0.001               # regularização L2