# ============================================================
# PIPELINE P00 - GERAÇÃO DE BASES DE DADOS
# ============================================================

condicoes_iniciais:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/${runtime_params:data_version,default_v1}/condicoes_iniciais.csv
  load_args:
    sep: ';'
    encoding: 'latin-1'
  save_args:
    index: False
    sep: ';'
    encoding: 'latin-1'

frequencias_angulares:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/${runtime_params:data_version,default_v1}/frequencias_angulares.csv
  load_args:
    sep: ';'
    encoding: 'latin-1'
  save_args:
    index: False
    sep: ';'
    encoding: 'latin-1'

solucao_rk4:
  type: pickle.PickleDataset
  filepath: data/03_primary/${runtime_params:data_version,default_v1}/solucao_rk4.pkl

base_oscilador:
  type: pandas.CSVDataset
  filepath: data/04_feature/${runtime_params:data_version,default_v1}/base_ohs.csv
  load_args:
    sep: ';'
    encoding: 'latin-1'
  save_args:
    index: False
    sep: ';'
    encoding: 'latin-1'

metadata_simulacao:
  type: json.JSONDataset
  filepath: data/04_feature/${runtime_params:data_version,default_v1}/metadata_simulacao.json
  save_args:
    indent: 2

