[project]
name = "oscilador_harmonico"
version = "0.1.0"
description = "Oscilador Harmônico Simples com RK4 e PyTorch"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "kedro>=1.3.0",
    "kedro-datasets>=1.0.0",
    "kedro-viz>=6.7.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.14.0",
    "scipy>=1.10.0",
]

[project.entry-points."kedro.project_plugins"]
oscilador_harmonico = "oscilador_harmonico.plugins"

[tool.kedro]
package_name = "oscilador_harmonico"
project_name = "oscilador_harmonico"
kedro_init_version = "1.3.0"

[build-system]
requires = ["setuptools>=45.0", "wheel"]
build-backend = "setuptools.build_meta"
[tool.kedro_telemetry]
project_id = "6a7d802782964575abff3ad294e610f5"
